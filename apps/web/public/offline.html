<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" />
		<title>Hors ligne | Prettyfull</title>
		<!--
			Page autonome servie par le service worker quand le réseau manque.
			Aucune ressource externe : elle doit s'afficher sans connexion.
		-->
		<style>
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				background: #ffffff;
				color: #141311;
				text-align: center;
			}
			main { max-width: 360px; }
			.mark {
				width: 72px;
				height: 72px;
				margin: 0 auto 24px;
				border-radius: 18px;
				background: #141311;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			h1 { font-size: 24px; margin: 0 0 8px; }
			p { margin: 0 0 8px; color: #57534e; line-height: 1.5; }
			.en { font-size: 14px; color: #78716c; }
			button {
				margin-top: 24px;
				min-height: 48px;
				padding: 0 28px;
				border: 0;
				border-radius: 6px;
				background: #141311;
				color: #ffffff;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button:focus-visible { outline: 3px solid #10b981; outline-offset: 3px; }
		</style>
	</head>
	<body>
		<main>
			<div class="mark" aria-hidden="true">
				<svg width="40" height="40" viewBox="0 0 36 36" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
					<line x1="18" y1="3" x2="18" y2="14" />
					<line x1="18" y1="33" x2="18" y2="22" />
					<line x1="3" y1="18" x2="14" y2="18" />
					<line x1="33" y1="18" x2="22" y2="18" />
					<path d="M11 9L18 16L25 9" />
					<path d="M11 27L18 20L25 27" />
				</svg>
			</div>
			<h1>Vous êtes hors ligne</h1>
			<p>Vérifiez votre connexion. Votre panier est conservé, vous pourrez reprendre là où vous en étiez.</p>
			<p class="en" lang="en">You're offline. Your cart is saved.</p>
			<button type="button" onclick="location.reload()">Réessayer</button>
		</main>
		<script>
			// Retour du réseau : on recharge sans attendre un clic.
			window.addEventListener("online", () => location.reload());
		</script>
	</body>
</html>
