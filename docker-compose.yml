version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: prettyfull-postgres
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prettyfull-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medusa:
    image: prettyfull-medusa-admin
    container_name: prettyfull-medusa
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - apps/prettyfull-medusa/.env
    environment:
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 9000
      MEDUSA_BACKEND_URL: http://localhost:9000,https://dev.prettyfull.shop
      STORE_CORS: http://localhost:3000,http://dev.prettyfull.shop,https://dev.prettyfull.shop
      ADMIN_CORS: http://localhost:9000,http://dev.prettyfull.shop,https://dev.prettyfull.shop
      AUTH_CORS: http://localhost:9000,http://localhost:3000,http://dev.prettyfull.shop,https://dev.prettyfull.shop
    ports:
      - "9000:9000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
