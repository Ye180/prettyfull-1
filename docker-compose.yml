services:
  postgres:
    image: postgres:17-alpine
    container_name: prettyfull-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prettyfull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prettyfull}
      POSTGRES_DB: ${POSTGRES_DB:-prettyfull}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prettyfull}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: prettyfull-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

