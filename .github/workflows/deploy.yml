name: Deploy PrettyFull Applications

on:
  push:
    branches:
      - dev-v2
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - *shared
            backend:
              - 'apps/backend/**'
              - *shared
            admin:
              - 'apps/admin/**'
              - *shared

  deploy:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            changed: ${{ needs.changes.outputs.web }}
          - app: backend
            changed: ${{ needs.changes.outputs.backend }}
          - app: admin
            changed: ${{ needs.changes.outputs.admin }}
    steps:
      - name: Checkout repository
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Skip
        if: matrix.changed != 'true'
        run: echo "No change in apps/${{ matrix.app }} — skipping."

      # Chaque app doit fournir son propre apps/<app>/Dockerfile.
      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }} image
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-${{ matrix.app }}:dev-latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-${{ matrix.app }}:buildcache,mode=max

      - name: Deploy ${{ matrix.app }} to server
        if: matrix.changed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USERNAME }}/apps/prettyfull/dev
            docker compose pull ${{ matrix.app }}
            docker compose up -d ${{ matrix.app }}
