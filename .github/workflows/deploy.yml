# .github/workflows/deploy.yml
name: Deploy PrettyFull Applications

on:
  push:
    branches:
      - develop
    paths:
      - "apps/web/**"
      - "apps/backend/**"
jobs:
  # Job séparé pour l'application web
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect web changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.web == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.changes.outputs.web == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web Docker image
        if: steps.changes.outputs.web == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfiles/web.Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-web:dev-latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-web:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-web:buildcache,mode=max

      - name: Deploy web to server
        if: steps.changes.outputs.web == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USERNAME }}/apps/prettyfull/dev
            docker compose -f docker-compose.yml pull prettyfull-web
            docker compose -f docker-compose.yml up -d prettyfull-web

  # Job séparé pour l'application backend
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/**'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.changes.outputs.backend == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfiles/backend.Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-backend:dev-latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-backend:buildcache,mode=max

      - name: Deploy backend to server
        if: steps.changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USERNAME }}/apps/prettyfull/dev
            docker compose -f docker-compose.yml pull prettyfull-backend
            docker compose -f docker-compose.yml up -d prettyfull-backend
