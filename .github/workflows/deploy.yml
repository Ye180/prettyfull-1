# .github/workflows/deploy.yml
name: Deploy PrettyFull Applications

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Stratégie pour lancer un job par application
    strategy:
      matrix:
        app: [web, backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour détecter les changements

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape pour détecter les changements
      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            ${{ matrix.app }}:
              - 'apps/${{ matrix.app }}/**'
              - 'packages/**' # Si un paquet partagé change, on reconstruit tout

      # Construire et pousser l'image seulement si des changements sont détectés
      - name: Build and push Docker image
        if: steps.changes.outputs[matrix.app] == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfiles/${{ matrix.app }}.Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-${{ matrix.app }}:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-${{ matrix.app }}:buildcache,mode=max

      # (Optionnel) Déployer sur le serveur
      - name: Deploy to server
        if: steps.changes.outputs[matrix.app] == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-${{ matrix.app }}:latest
            docker stop prettyfull-${{ matrix.app }} || true
            docker rm prettyfull-${{ matrix.app }} || true
            docker run -d --restart always --name prettyfull-${{ matrix.app }} -p ${{ matrix.app == 'web' && 3000 || matrix.app == 'admin' && 3001 || 8080 }}:${{ matrix.app == 'backend' && 8080 || 3000 }} ${{ secrets.DOCKERHUB_USERNAME }}/prettyfull-${{ matrix.app }}:latest
