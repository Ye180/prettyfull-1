packages:
  - apps/*
  - packages/*

# Une seule copie de React et de ses types dans tout le monorepo :
# deux @types/react en parallèle produisent des erreurs
# "Two different types with this name exist, but they are unrelated".
overrides:
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  '@types/node': ^22.20.1
  csstype: 3.1.3
  '@medusajs/types': 2.11.3
  '@medusajs/js-sdk': 2.11.3
  '@medusajs/framework': 2.11.3
  # Force une copie unique et à jour de caniuse-lite (évite l'avertissement
  # "browsers data is X months old" et le doublon de versions transitif).
  caniuse-lite: ^1.0.30001803

onlyBuiltDependencies:
  - '@swc/core'
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - core-js-pure
  - esbuild
  - sharp
  - unrs-resolver
